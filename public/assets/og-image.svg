<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1a1b2e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0A0B10" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="28%" fx="50%" fy="48%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0A0B10" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="s-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Halo glow behind lettermark -->
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Corner accent lines -->
  <g stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="40" y1="40" x2="100" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="100"/>
    <line x1="1160" y1="40" x2="1100" y2="40"/>
    <line x1="1160" y1="40" x2="1160" y2="100"/>
    <line x1="40" y1="590" x2="100" y2="590"/>
    <line x1="40" y1="590" x2="40" y2="530"/>
    <line x1="1160" y1="590" x2="1100" y2="590"/>
    <line x1="1160" y1="590" x2="1160" y2="530"/>
  </g>

  <!-- CS Lettermark -->
  <!-- "C" letter -->
  <text
    x="510"
    y="360"
    font-family="'Arial Black', 'Helvetica Neue', sans-serif"
    font-size="220"
    font-weight="900"
    fill="url(#c-grad)"
    filter="url(#text-glow)"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-8">C</text>

  <!-- "S" letter -->
  <text
    x="700"
    y="360"
    font-family="'Arial Black', 'Helvetica Neue', sans-serif"
    font-size="220"
    font-weight="900"
    fill="url(#s-grad)"
    filter="url(#text-glow)"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-8">S</text>

  <!-- Thin separator line -->
  <rect x="440" y="430" width="320" height="1.5" fill="#ffffff" fill-opacity="0.08" rx="1"/>

  <!-- Product name -->
  <text
    x="600"
    y="470"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-size="22"
    font-weight="700"
    fill="#e2e8f0"
    text-anchor="middle"
    letter-spacing="8">CHRONOS SENTINEL</text>

  <!-- Tagline -->
  <text
    x="600"
    y="508"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-size="15"
    font-weight="400"
    fill="#94a3b8"
    text-anchor="middle"
    letter-spacing="3">AI-ASSISTED OPEN-SOURCE INTELLIGENCE</text>

  <!-- Bottom domain badge -->
  <rect x="512" y="550" width="176" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <text
    x="600"
    y="569"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-size="12"
    font-weight="400"
    fill="#64748b"
    text-anchor="middle"
    letter-spacing="1.5">sentinel.codexarchai.com</text>
</svg>
